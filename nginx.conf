server {
    listen 80;
    server_name _;

    location /index.m3u8 {
        proxy_pass http://138.186.23.7:8082/CINECANAL/index.m3u8;
        proxy_set_header Host 138.186.23.7;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tracks-v1a1/ {
        proxy_pass http://138.186.23.7:8082/CINECANAL/tracks-v1a1/;
        proxy_set_header Host 138.186.23.7;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}